name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you change?
  - type: textarea
    id: native
    attributes:
      label: Can Claude Code already do this?
      description: A built-in command, setting or official plugin that covers part of it.
